<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple blog management system">
    <title>Blog Management System</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>

<header class="header">
    <div class="container header-content">
        <a href="index.html" class="logo">BlogSpace</a>

        <nav class="navigation">
            <a href="#posts">Posts</a>
            <a href="#auth">Account</a>
        </nav>

        <div class="auth-actions">
            <button id="show-login-btn" type="button">Login</button>
            <button id="show-register-btn" type="button">Register</button>
            <button id="logout-btn" type="button" hidden>Logout</button>
        </div>
    </div>
</header>

<main class="container">

    <section class="hero">
        <h1>Welcome to BlogSpace</h1>
        <p>Discover ideas, share your thoughts, and join the conversation.</p>
    </section>

    <section id="auth" class="auth-section">
        <div id="auth-message" role="status" aria-live="polite"></div>

        <form id="login-form" class="auth-form" hidden>
            <h2>Login</h2>

            <label for="login-username">Username</label>
            <input
                    type="text"
                    id="login-username"
                    name="username"
                    required
                    autocomplete="username"
            >

            <label for="login-password">Password</label>
            <input
                    type="password"
                    id="login-password"
                    name="password"
                    required
                    autocomplete="current-password"
            >

            <button type="submit">Login</button>
        </form>

        <form id="register-form" class="auth-form" hidden>
            <h2>Create an Account</h2>

            <label for="register-username">Username</label>
            <input
                    type="text"
                    id="register-username"
                    name="username"
                    required
                    autocomplete="username"
            >

            <label for="register-email">Email</label>
            <input
                    type="email"
                    id="register-email"
                    name="email"
                    required
                    autocomplete="email"
            >

            <label for="register-password">Password</label>
            <input
                    type="password"
                    id="register-password"
                    name="password"
                    required
                    autocomplete="new-password"
            >

            <button type="submit">Register</button>
        </form>

        <p id="user-info" hidden></p>
    </section>

    <section id="create-post-section" hidden>
        <h2>Create a Post</h2>

        <form id="create-post-form">
            <label for="post-title">Title</label>
            <input
                    type="text"
                    id="post-title"
                    name="title"
                    required
            >

            <label for="post-content">Content</label>
            <textarea
                    id="post-content"
                    name="content"
                    rows="6"
                    required
            ></textarea>

            <button type="submit">Publish Post</button>
        </form>
    </section>

    <section id="posts" class="posts-section">
        <div class="section-heading">
            <h2>Latest Posts</h2>
            <button id="refresh-posts-btn" type="button">
                Refresh
            </button>
        </div>

        <div id="posts-message" role="status" aria-live="polite"></div>
        <div id="posts-container" class="posts-container"></div>
    </section>

    <section id="post-details-section" hidden>
        <button id="back-to-posts-btn" type="button">
            Back to Posts
        </button>

        <article id="post-details"></article>
    </section>

</main>

<footer class="footer">
    <div class="container">
        <p>&copy; 2026 BlogSpace. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
